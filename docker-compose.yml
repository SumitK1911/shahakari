services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sahakari
      POSTGRES_USER: sahakari
      POSTGRES_PASSWORD: sahakari
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahakari -d sahakari"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python -m app.bootstrap && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  worker:
    build: ./backend
    env_file:
      - ./backend/.env.example
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO"]

  beat:
    build: ./backend
    env_file:
      - ./backend/.env.example
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO"]

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    ports:
      - "5173:5173"
    command: ["sh", "-c", "npm install && npm run dev"]

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
